[package]
name = "agentic_api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local MCP handlers library
mcp-handlers = { path = "../agentic-flowstate-mcp/mcp-handlers" }

# Ticketing system (SQLite data layer)
ticketing-system = { path = "../agentic-flowstate-ticketing-system" }

# Process detachment (setsid for restart scripts)
libc = "0.2"

# Web framework
axum = { version = "0.7", features = ["default", "ws", "multipart"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower-cookies = "0.10"
http = "1"

# SQLite
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
url = "2"
serde_urlencoded = "0.7"
multer = "3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metrics (T-56987678). The `metrics` facade is the prometheus-compatible
# frontend; `metrics-exporter-prometheus` renders the registry to text for
# the /metrics endpoint that Grafana scrapes.
metrics = "0.22"
metrics-exporter-prometheus = { version = "0.13", default-features = false }

# Utils
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
once_cell = "1.19"
# Sharded concurrent hash map. Used by the per-(user, conversation)
# stream rate limiter (T-C410DD96) so a single global bucket table is
# accessed under sharded locks rather than one global Mutex — a stream
# check never contends with an unrelated (user, conversation)'s check.
dashmap = "5"

# Streaming/async
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# Regex for prompt processing
regex = "1.10"

# Filesystem operations
dirs = "5.0"

# HTTP client for OpenAI API
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation"] }
lazy_static = "1.4"
# APNs push notifications (JWT signing)
jsonwebtoken = "9"
# APNs HTTP/2 client (Threema fork) for silent / background pushes
apns-h2 = "0.11"

# IMAP for email fetching
async-imap = "0.10"
async-native-tls = "0.5"
mail-parser = "0.9"
async-std = { version = "1.13", features = ["attributes"] }

# AWS SES for sending emails
aws-config = "1.1"
aws-sdk-sesv2 = "1.9"
aws-sdk-sqs = "1.9"
aws-sdk-secretsmanager = "1.9"
aws-sdk-dynamodb = "1.9"

# HTML sanitization
ammonia = "4"

# MIME email construction (for reply/forward with proper headers)
mail-builder = "0.3"

[[bin]]
name = "agentic_api"
path = "src/main.rs"

[[bin]]
name = "agentic_runner"
path = "src/bin/agentic_runner.rs"

[[bin]]
name = "ses_event_quarantine"
path = "src/bin/ses_event_quarantine.rs"
